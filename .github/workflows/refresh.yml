name: Actualizar datos
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-datos
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Limite de 1 importacion por hora (solo bajo demanda)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh.yml/runs?per_page=30&status=success&created=>=$since" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          echo "importaciones en la ultima hora: $n"
          if [ "$n" -gt 0 ]; then
            echo "Omitido: ya hubo una importacion hace menos de 1 hora"
            gh run cancel ${{ github.run_id }}
            sleep 60
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar datos de basketaraba.com
        run: python scrape.py && python split.py data.json
      - name: Guardar si hay cambios
        run: |
          git config user.name "basketaraba-alava"
          git config user.email "basketaraba-alava@users.noreply.github.com"
          git add data-1.json data-2.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
